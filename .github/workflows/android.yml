name: Android APK

on:
  push:
    branches: [main, ccr-88efb4cf-5pv4l5]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web files
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "icons/android/ic_launcher-$d.png" "$RES/mipmap-$d/ic_launcher.png"
            cp "icons/android/ic_launcher-$d.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk work-rhythm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: work-rhythm-apk
          path: work-rhythm.apk
          retention-days: 30

      # 휴대폰에서 로그인 없이 받을 수 있게 릴리스에 올림
      # 항상 최신: https://github.com/<owner>/<repo>/releases/latest/download/work-rhythm.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 업무 리듬 안드로이드 앱 (빌드 ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: work-rhythm.apk
          body: |
            휴대폰에서 work-rhythm.apk를 눌러 내려받고 설치하세요. 설치할 때 "출처를 알 수 없는 앱" 허용이 필요해요.
            이미 설치했다면 덮어서 설치해도 데이터는 그대로 남아요.
