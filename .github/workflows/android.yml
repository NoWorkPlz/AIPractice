name: Android APK

on:
  push:
    branches: [main, ccr-88efb4cf-5pv4l5]
    paths-ignore: ["README.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web files
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "icons/android/ic_launcher-$d.png" "$RES/mipmap-$d/ic_launcher.png"
            cp "icons/android/ic_launcher-$d.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk work-rhythm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: work-rhythm-apk
          path: work-rhythm.apk
          retention-days: 30
