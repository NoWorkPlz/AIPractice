<html lang="ko"><!--shell-->
<head><!--shell-->

<title>업무 리듬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 요약 띠 + 탭(오늘·주간·월간·업무 관리), 오늘 화면은 할 일(넓게) | 다가오는 업무·메모(좁게) 2단 */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --sunken: #e8ece7;
  --ink: #1b2320;
  --muted: #5d6a64;
  --line: #d8ded7;
  --accent: #2c5c4e;
  --accent-ink: #ffffff;
  --accent-soft: #dfebe5;
  --warn: #b0432a;
  --warn-soft: #f6e2db;
  --c-daily: #2c5c4e;
  --c-weekly: #3c5a8c;
  --c-biweekly: #6a4f8f;
  --c-monthly: #9a6512;
  --c-quarterly: #a23f5c;
  --c-once: #5d6a64;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #192019; --sunken: #141a17; --ink: #e4ebe7; --muted: #94a29b; --line: #2a3430;
    --accent: #7cc2a9; --accent-ink: #0f1a16; --accent-soft: #1d362e; --warn: #f0896c; --warn-soft: #3b211a;
    --c-daily: #7cc2a9; --c-weekly: #8fb0e6; --c-biweekly: #b9a0e0; --c-monthly: #e2b25e; --c-quarterly: #ec8fab; --c-once: #94a29b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #192019; --sunken: #141a17; --ink: #e4ebe7; --muted: #94a29b; --line: #2a3430;
  --accent: #7cc2a9; --accent-ink: #0f1a16; --accent-soft: #1d362e; --warn: #f0896c; --warn-soft: #3b211a;
  --c-daily: #7cc2a9; --c-weekly: #8fb0e6; --c-biweekly: #b9a0e0; --c-monthly: #e2b25e; --c-quarterly: #ec8fab; --c-once: #94a29b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1120px; margin: 0 auto; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* 상단 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .inner { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-block: 20px 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.date-big { font-size: clamp(24px, 4vw, 32px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stat { display: flex; flex-direction: column; min-width: 72px; }
.stat b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 500; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.alert b { color: var(--warn); }

.tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 14px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .badge { display: inline-block; margin-left: 6px; font-size: 11px; font-family: var(--font-mono); padding: 0 6px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); }

main { padding-block: 22px 60px; }
h2 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-head small { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.progress { height: 6px; border-radius: 99px; background: var(--sunken); overflow: hidden; margin: 4px 0 14px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .25s ease; }

/* 업무 행 */
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.check { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 1.5px solid var(--muted); background: var(--surface); display: grid; place-items: center; padding: 0; color: transparent; }
.check svg { width: 14px; height: 14px; }
.task.is-done .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task.is-skip .check { background: var(--sunken); border-color: var(--line); color: var(--muted); }
.t-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t-title { font-weight: 500; overflow-wrap: anywhere; }
.task.is-done .t-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.t-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.t-note { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.cad { font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.cad::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.cad-daily { color: var(--c-daily); } .cad-weekly { color: var(--c-weekly); } .cad-biweekly { color: var(--c-biweekly); }
.cad-monthly { color: var(--c-monthly); } .cad-quarterly { color: var(--c-quarterly); } .cad-once { color: var(--c-once); }
.pri { color: var(--warn); font-weight: 600; }
.t-date { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.t-actions { display: flex; gap: 6px; flex: none; }

.group + .group { margin-top: 14px; }
.group-label { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin: 0 0 2px; display: flex; gap: 8px; }

.overdue { border-color: var(--warn); background: linear-gradient(var(--warn-soft), var(--warn-soft)) top / 100% 4px no-repeat, var(--surface); }
.overdue h2 { color: var(--warn); }

/* 버튼·폼 */
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.ghost { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.ghost:hover { border-color: var(--muted); }
.sm { padding: 3px 9px; font-size: 12px; }
.danger { color: var(--warn); }
.danger.armed { background: var(--warn); color: var(--surface); border-color: var(--warn); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 10px; min-width: 0;
}
textarea { resize: vertical; min-height: 110px; line-height: 1.6; }
.quick { display: flex; gap: 8px; margin-top: 12px; }
.quick input { flex: 1; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; cursor: pointer; background: var(--surface); }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.msg { font-size: 13px; color: var(--warn); min-height: 1em; }
.check-line { display: flex; gap: 8px; align-items: center; font-size: 13px; }

.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; font-size: 14px; margin-bottom: 18px; }

/* 주간 */
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.nav .label { font-weight: 700; margin: 0 6px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; min-width: 0; }
.day-col.is-today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.day-col.is-weekend { background: var(--sunken); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-bottom: 4px; }
.day-head b { font-size: 14px; }
.day-head span { font-size: 12px; color: var(--muted); }
.day-col .task { padding: 6px 0; gap: 7px; }
.day-col .check { width: 18px; height: 18px; border-radius: 5px; }
.day-col .t-title { font-size: 13px; line-height: 1.4; }
@media (max-width: 900px) {
  .week { grid-template-columns: minmax(0, 1fr); }
  .day-col.is-weekend.is-empty { display: none; }
}

/* 월간 */
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; }
.cal-h { background: var(--sunken); text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 0; }
.cell { background: var(--surface); min-height: 96px; padding: 6px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cell.out { background: var(--sunken); color: var(--muted); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cell .d { font-family: var(--font-mono); font-size: 12px; display: flex; justify-content: space-between; gap: 4px; }
.cell.today .d b { background: var(--accent); color: var(--accent-ink); border-radius: 5px; padding: 0 5px; }
.cell .d em { font-style: normal; color: var(--muted); }
.cell .d em.all { color: var(--accent); }
.cell .it { font-size: 11.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.cell .it::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
.cell .it.done { opacity: .45; text-decoration: line-through; }
.cell .more { font-size: 11px; color: var(--muted); }
.cell .dots { display: none; gap: 3px; flex-wrap: wrap; }
.cell .dots i { width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
@media (max-width: 640px) {
  .cell { min-height: 58px; padding: 4px; }
  .cell .it, .cell .more { display: none; }
  .cell .dots { display: flex; }
}
.hol { color: var(--warn); }
.cell.hol .d b { color: var(--warn); }
.cell.today.hol .d b { color: var(--accent-ink); }
.cell .hol-name { font-size: 11px; color: var(--warn); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hol-name { font-size: 12px; color: var(--warn); margin: 0 0 4px; }
.steps { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.steps b:first-child { margin-right: 6px; }
@media (max-width: 640px) { .cell .hol-name { font-size: 10px; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; margin-top: 10px; }

/* 업무 관리 */
.mgr { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.mgr .form-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); }
@media (max-width: 860px) { .mgr { grid-template-columns: minmax(0, 1fr); } .mgr .form-panel { position: static; order: -1; } }
.trow { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow.paused { opacity: .55; }
.trow .t-body { gap: 3px; }
.rule { font-size: 13px; }
.next { font-size: 12px; color: var(--muted); }
.filters { margin-bottom: 12px; }
.tag-sample { font-size: 11px; border: 1px dashed var(--muted); color: var(--muted); border-radius: 4px; padding: 0 4px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head><!--shell-->
<body><!--shell-->

<header class="top gutter">
  <div class="inner">
    <div class="brand">
      <span class="eyebrow" id="hdr-eyebrow">업무 리듬</span>
      <h1 class="date-big" id="hdr-date">오늘</h1>
    </div>
    <div class="stats" id="hdr-stats"></div>
  </div>
</header>
<nav class="tabs-bar gutter" aria-label="화면">
  <div class="inner tabs" role="tablist">
    <button class="tab" role="tab" data-view="today" type="button">오늘</button>
    <button class="tab" role="tab" data-view="week" type="button">주간</button>
    <button class="tab" role="tab" data-view="month" type="button">월간</button>
    <button class="tab" role="tab" data-view="tasks" type="button">업무 관리</button>
  </div>
</nav>
<main class="gutter"><div class="inner" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var STORE_KEY = "work-rhythm-v1";
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var CAD = { daily: "일간", weekly: "주간", biweekly: "격주", monthly: "월간", quarterly: "분기", once: "일회성" };
  var CAD_ORDER = { daily: 0, weekly: 1, biweekly: 2, monthly: 3, quarterly: 4, once: 5 };
  var PRI = { high: 0, mid: 1, low: 2 };
  var PRI_LABEL = { high: "높음", mid: "보통", low: "낮음" };
  var QUARTER_LABEL = ["분기 첫째 달", "분기 둘째 달", "분기 마지막 달"];
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ---------- 날짜 ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function diffDays(a, b) { return Math.round((b - a) / 864e5); }
  function weekStart(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 864e5 + 1) / 7);
  }
  function fmt(d) { return (d.getMonth() + 1) + "/" + d.getDate() + " (" + DOW[d.getDay()] + ")"; }

  /* ---------- 공휴일 ---------- */
  // 관공서 공휴일 + 대체공휴일 + 선거일·임시공휴일. 2026년부터 노동절·제헌절 포함
  var HOLIDAY_YEARS = [2025, 2026, 2027];
  var HOLIDAYS = {};
  [
    "2025-01-01 신정|2025-01-27 임시공휴일|2025-01-28 설날 연휴|2025-01-29 설날|2025-01-30 설날 연휴|2025-03-01 삼일절|2025-03-03 대체공휴일(삼일절)" +
    "|2025-05-05 어린이날·부처님오신날|2025-05-06 대체공휴일|2025-06-03 대통령선거일|2025-06-06 현충일|2025-08-15 광복절|2025-10-03 개천절" +
    "|2025-10-05 추석 연휴|2025-10-06 추석|2025-10-07 추석 연휴|2025-10-08 대체공휴일(추석)|2025-10-09 한글날|2025-12-25 성탄절",
    "2026-01-01 신정|2026-02-16 설날 연휴|2026-02-17 설날|2026-02-18 설날 연휴|2026-03-01 삼일절|2026-03-02 대체공휴일(삼일절)|2026-05-01 노동절" +
    "|2026-05-05 어린이날|2026-05-24 부처님오신날|2026-05-25 대체공휴일(부처님오신날)|2026-06-03 지방선거일|2026-06-06 현충일|2026-07-17 제헌절" +
    "|2026-08-15 광복절|2026-08-17 대체공휴일(광복절)|2026-09-24 추석 연휴|2026-09-25 추석|2026-09-26 추석 연휴|2026-10-03 개천절" +

    if (t.monthRule === "lastBiz") { d = n; while (d > 1 && isOff(new Date(y, m, d))) d--; return d; }

  function weeklyOccurs(t, date) {

  function holidayPanel() {

      '<p class="hint" style="margin:0 0 10px">공휴일과 여기 등록한 회사 휴무일은 쉬는 날로 계산해요. 첫·마지막 영업일, 직전 영업일로 당기기, 영업일 수에 모두 반영돼요.</p>' +

        return '<li class="task"><div class="t-body"><span class="t-title">' + esc(h.name) + '</span><span class="t-meta"><span class="t-date">' + h.date.slice(0, 4) + " · " + fmt(parse(h.date)) + "</span>" + (h.date < tk ? "<span>지남</span>" : "") + "</span></div>" +
          '<div class="t-actions"><button class="ghost sm danger" type="button" data-act="del-hol" data-k="' + h.date + '">삭제</button></div></li>';
      }).join("") + "</ul>";
    }
    var next = upcomingHolidays(addDays(t0, -1), 400, 8).filter(function (h) { return !h.custom; });
    html += '<p class="group-label" style="margin-top:14px">다가오는 공휴일</p><ul class="tasks">' + next.map(function (h) {
      return '<li class="task"><div class="t-body"><span class="t-title">' + esc(h.name) + '</span><span class="t-meta"><span class="t-date">' + h.d.getFullYear() + " · " + fmt(h.d) + "</span></span></div></li>";

  function isStandalone() {
    try { return !!(window.Capacitor || navigator.standalone || window.matchMedia("(display-mode: standalone)").matches); } catch (e) { return false; }
  }
  function installPanel() {
    var html = '<section class="panel"><div class="sec-head"><h2>스마트폰 앱으로 쓰기</h2></div>';
    if (isStandalone()) return html + '<p class="empty">지금 앱으로 실행 중이에요. 인터넷이 없어도 열리고, 데이터는 이 기기에 저장돼요.</p></section>';
    return html + (installEvt ? '<p style="margin:0 0 10px"><button class="btn" type="button" data-act="install">홈 화면에 앱 설치</button></p>' : "") +
      '<ul class="steps"><li><b>안드로이드</b> 크롬이나 삼성 인터넷에서 이 페이지를 열고 메뉴 → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b></li>' +
      '<li><b>아이폰</b> 사파리에서 열고 공유 버튼 → <b>홈 화면에 추가</b></li></ul>' +
      '<p class="hint" style="margin:8px 0 0">설치는 https 웹 주소로 열었을 때 돼요. 설치한 앱은 인터넷 없이도 열려요. 휴대폰과 PC는 데이터가 따로 저장되니, 옮길 때는 아래 백업을 쓰세요.</p></section>';
  }
  function upcomingHolidays(from, days, max) {
    var out = [];
    for (var i = 1; i <= days && out.length < max; i++) {
      var d = addDays(from, i), hn = holidayName(d);
      if (hn) out.push({ d: d, dd: i, name: hn, custom: !!customHol[keyOf(d)] });
    }
    return out;
  }
  function uniqueCats() {
    var seen = {}, out = ["보고", "회의", "정산", "계획", "기록"];
    state.tasks.forEach(function (t) { if (t.category) out.push(t.category); });
    return out.filter(function (c) { if (seen[c]) return false; seen[c] = 1; return true; });
  }
  function formCad() { var r = document.querySelector('input[name="f-cad"]:checked'); return r ? r.value : "daily"; }

    var cad = formCad(), rule = document.getElementById("f-rule").value;

      var on = el.dataset.show.split(" ").indexOf(cad) !== -1;

      el.hidden = !on;
    });
  }
  function setWeekdays(arr) { document.querySelectorAll('input[name="f-wd"]').forEach(function (c) { c.checked = arr.indexOf(Number(c.value)) !== -1; }); }
  function fillForm(t) {
    var tk = keyOf(today());
    t = t || baseTask({ cadence: "daily", weekdays: [1, 2, 3, 4, 5], anchor: tk, date: tk, monthDay: 25, shiftWeekend: true });
    document.getElementById("f-title").value = t.title;
    document.getElementById("f-cad-" + t.cadence).checked = true;
    setWeekdays(t.weekdays.length ? t.weekdays : [1, 2, 3, 4, 5]);
    document.getElementById("f-anchor").value = t.anchor || tk;
    document.getElementById("f-hrule").value = holidayRule(t);
    document.getElementById("f-quarter").value = String(t.quarterMonth || 0);
    document.getElementById("f-rule").value = t.monthRule || "day";
    document.getElementById("f-day").value = t.monthDay || 25;
    document.getElementById("f-shift").checked = !!t.shiftWeekend;
    document.getElementById("f-date").value = t.date || tk;
    document.getElementById("f-cat").value = t.category || "";
    document.getElementById("f-pri").value = t.priority || "mid";

  function submitForm() {
    var msg = document.getElementById("form-msg");
    var title = document.getElementById("f-title").value.trim();
    var cad = formCad();
    var wd = Array.prototype.map.call(document.querySelectorAll('input[name="f-wd"]:checked'), function (c) { return Number(c.value); });
    var o = {
      title: title, cadence: cad, weekdays: (cad === "daily" || cad === "weekly") ? wd : [],
      anchor: document.getElementById("f-anchor").value, quarterMonth: Number(document.getElementById("f-quarter").value),
      monthRule: document.getElementById("f-rule").value, monthDay: Math.min(31, Math.max(1, Number(document.getElementById("f-day").value) || 1)),
      shiftWeekend: document.getElementById("f-shift").checked,
      holidayRule: (cad === "daily" || cad === "weekly" || cad === "biweekly") ? document.getElementById("f-hrule").value : "", date: document.getElementById("f-date").value,
      category: document.getElementById("f-cat").value.trim(), priority: document.getElementById("f-pri").value,
      note: document.getElementById("f-note").value.trim()
    };
    if (!title) { msg.textContent = "업무 이름을 입력하세요."; document.getElementById("f-title").focus(); return; }
    if ((cad === "daily" || cad === "weekly") && !wd.length) { msg.textContent = "요일을 하나 이상 고르세요."; return; }
    if (cad === "biweekly" && !o.anchor) { msg.textContent = "격주 업무의 기준일을 정하세요."; return; }
    if (cad === "once" && !o.date) { msg.textContent = "날짜를 정하세요."; return; }
    if (editingId) {
      var t = state.tasks.find(function (x) { return x.id === editingId; });
      for (var k in o) t[k] = o[k];
      t.sample = false;
      if (cad === "biweekly" && t.start > o.anchor) t.start = o.anchor;
      editingId = null;
      toast("수정했어요");
    } else {
      var nt = baseTask(o);
      if (cad === "biweekly" && o.anchor < nt.start) nt.start = o.anchor;
      state.tasks.push(nt);
      toast("등록했어요 · " + describe(nt));
    }
    save(); render();
  }

  /* ---------- 렌더 ---------- */
  function render() {
    renderHeader();
    var keepScroll = window.scrollY;
    root.innerHTML = view === "today" ? viewToday() : view === "week" ? viewWeek() : view === "month" ? viewMonth() : viewTasks();
    if (view === "tasks") fillForm(editingId ? state.tasks.find(function (t) { return t.id === editingId; }) : null);
    window.scrollTo(0, keepScroll);
  }
  function go(v) {
    view = v;

  }

  var installEvt = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvt = e; if (view === "tasks") render(); });
  window.addEventListener("appinstalled", function () { installEvt = null; toast("앱을 설치했어요"); if (view === "tasks") render(); });

  var armed = {};
  function arm(btn, key, label, fn) {
    if (armed[key]) { clearTimeout(armed[key]); armed[key] = null; fn(); return; }
    var old = btn.textContent; btn.textContent = label; btn.classList.add("armed");
    armed[key] = setTimeout(function () { armed[key] = null; btn.textContent = old; btn.classList.remove("armed"); }, 3000);
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest(".tab");
    if (tab) { go(tab.dataset.view); return; }
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var id = b.dataset.id, k = b.dataset.k, key = id + "|" + k;
    switch (b.dataset.act) {
      case "toggle": if (state.done[key]) delete state.done[key]; else state.done[key] = "d"; save(); render(); break;
      case "skip": state.done[key] = "s"; save(); render(); break;
      case "skip-all": overdueList().forEach(function (o) { state.done[o.t.id + "|" + o.k] = "s"; }); save(); render(); toast("밀린 업무를 건너뜀으로 정리했어요"); break;
      case "week-prev": weekCursor = addDays(weekCursor, -7); render(); break;
      case "week-next": weekCursor = addDays(weekCursor, 7); render(); break;
      case "week-now": weekCursor = today(); render(); break;
      case "month-prev": monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() - 1, 1); render(); break;
      case "month-next": monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + 1, 1); render(); break;
      case "month-now": monthCursor = new Date(today().getFullYear(), today().getMonth(), 1); selDay = keyOf(today()); render(); break;
      case "pick": selDay = k; render(); break;
      case "del-hol":
        state.holidays = state.holidays.filter(function (h) { return h.date !== k; });
        indexHolidays(); save(); render(); toast("휴무일을 지웠어요");
        break;
      case "install":
        if (installEvt) { installEvt.prompt(); installEvt.userChoice.then(function () { installEvt = null; render(); }); }
        break;
      case "edit": editingId = id; render(); document.getElementById("f-title").focus(); break;
      case "cancel-edit": editingId = null; render(); break;
      case "pause": {
        var t = state.tasks.find(function (x) { return x.id === id; });
        t.active = !t.active; save(); render(); toast(t.active ? "다시 시작했어요" : "일시 중지했어요"); break;
      }
      case "del":
        arm(b, "del" + id, "정말 삭제?", function () {
          state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
          Object.keys(state.done).forEach(function (dk) { if (dk.indexOf(id + "|") === 0) delete state.done[dk]; });
          if (editingId === id) editingId = null;
          save(); render(); toast("삭제했어요");
        });
        break;
      case "clear-samples": {
        var ids = {};
        state.tasks.forEach(function (x) { if (x.sample) ids[x.id] = 1; });
        state.tasks = state.tasks.filter(function (x) { return !x.sample; });
        Object.keys(state.done).forEach(function (dk) { if (ids[dk.split("|")[0]]) delete state.done[dk]; });
        editingId = null; save(); render(); toast("예시 업무를 지웠어요");
        break;
      }
      case "export": {
        var ta = document.getElementById("backup-text");
        ta.value = JSON.stringify(state);
        ta.select();
        var m = document.getElementById("backup-msg");
        try {
          navigator.clipboard.writeText(ta.value).then(function () { toast("백업 내용을 복사했어요"); m.textContent = ""; },
            function () { m.textContent = "자동 복사가 막혀 있어요. 선택된 내용을 직접 복사하세요."; });
        } catch (err) { m.textContent = "자동 복사가 막혀 있어요. 선택된 내용을 직접 복사하세요."; }
        break;
      }
      case "import": {
        var msg = document.getElementById("backup-msg");
        try {
          var data = JSON.parse(document.getElementById("backup-text").value);
          if (!data || !Array.isArray(data.tasks)) throw new Error();
          state = { tasks: data.tasks.map(function (x) { return baseTask(x); }), done: data.done || {}, notes: data.notes || {}, holidays: Array.isArray(data.holidays) ? data.holidays : [] };
          indexHolidays();
          editingId = null; save(); render(); toast("업무 " + state.tasks.length + "개를 가져왔어요");
        } catch (err) { msg.textContent = "백업 형식이 아니에요. 내보내기로 만든 내용을 그대로 붙여 넣으세요."; }
        break;
      }
      case "reset":
        arm(b, "reset", "모두 지울까요?", function () { state = { tasks: [], done: {}, notes: {}, holidays: [] }; indexHolidays(); editingId = null; save(); render(); toast("모두 지웠어요"); });
        break;
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.name === "flt") { filter = e.target.value; render(); }
    if (e.target.name === "f-cad") document.getElementById("f-hrule").value = e.target.value === "daily" ? "skip" : "before";
    if (e.target.name === "f-cad" || e.target.id === "f-rule") syncForm();
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "task-form") submitForm();
    if (e.target.id === "hol-form") {
      var hd = document.getElementById("h-date").value, hname = document.getElementById("h-name").value.trim();
      if (!hd || !hname) { document.getElementById("hol-msg").textContent = "날짜와 이름을 모두 입력하세요."; return; }
      state.holidays = state.holidays.filter(function (h) { return h.date !== hd; }).concat([{ date: hd, name: hname }]);
      indexHolidays(); save(); render(); toast(fmt(parse(hd)) + " 휴무일로 등록했어요");
    }
    if (e.target.id === "quick-form") {
      var inp = document.getElementById("quick-input"), v = inp.value.trim();
      if (!v) return;
      var tk = keyOf(today());
      state.tasks.push(baseTask({ title: v, cadence: "once", date: tk }));
      save(); render(); toast("오늘 할 일에 추가했어요");
      document.getElementById("quick-input").focus();
    }
  });
  var noteTimer;
  document.addEventListener("input", function (e) {
    if (e.target.id !== "day-note") return;
    var val = e.target.value, tk = keyOf(today());
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () {
      if (val.trim()) state.notes[tk] = val; else delete state.notes[tk];
      save();
      var s = document.getElementById("note-saved"); if (s) s.textContent = "저장됨";
    }, 400);
  });
  // 자정을 넘겨 다시 열면 날짜를 새로 계산
  var lastDay = keyOf(today());
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && keyOf(today()) !== lastDay) { lastDay = keyOf(today()); selDay = lastDay; render(); }
  });

  state = load() || seed();
  if (!Array.isArray(state.holidays)) state.holidays = [];
  indexHolidays();
  save();
  var start = (location.hash || "").slice(1);
  if (!start) { try { start = sessionStorage.getItem(STORE_KEY + "-view") || ""; } catch (e) {} }
  view = ["today", "week", "month", "tasks"].indexOf(start) !== -1 ? start : "today";
  render();

  // 웹 주소로 열었을 때만 오프라인 캐시(서비스 워커) 등록. 안드로이드 앱(Capacitor)은 파일을 내장하므로 제외
  try {
    if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Capacitor) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  } catch (e) {}
})();
</script>
